server {
    listen 80;
    server_name shroom.surfplus.xyz;

    root /www/wwwroot/shroom/public;
    index index.html;
    client_max_body_size 21m;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 "Shroom HTTPS setup is pending.\n";
    }
}
