server {
    listen 80;
    server_name shroom.evox.run;

    root /www/wwwroot/shroom/public;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 "Shroom HTTPS is being provisioned.\n";
    }
}
