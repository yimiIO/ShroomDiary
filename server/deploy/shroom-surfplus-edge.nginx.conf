server {
    listen 80;
    server_name shroom.surfplus.xyz;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name shroom.surfplus.xyz;
    error_log /www/wwwlogs/shroom-surfplus-edge.error.log warn;

    ssl_certificate /www/server/panel/vhost/cert/admin.surfplus.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/admin.surfplus.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SHROOM_SURFPLUS_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 21m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass https://127.0.0.1:3104;
        proxy_http_version 1.1;
        proxy_set_header Host shroom.surfplus.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name shroom.surfplus.xyz;
        proxy_ssl_session_reuse off;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
