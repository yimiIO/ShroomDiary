name: Validate personal test branch

on:
  push:
    branches: [cloud-test]
  workflow_dispatch:

concurrency:
  group: shroom-personal-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-build-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The legacy uni-app toolchain still depends on node-sass 6, whose last
      # supported runtime is Node 16. Keep this build isolated from the modern
      # API/admin runtime instead of weakening either side.
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build H5 client
        run: npm ci && npm run build:h5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            admin/package-lock.json

      - name: Verify API and build admin
        run: |
          npm --prefix server ci
          npm --prefix admin ci
          find server/test -maxdepth 1 -name '*.test.js' \
            ! -name 'shroom-brand-system.test.js' \
            ! -name 'xiaohongshu-pilot.test.js' \
            -print0 | xargs -0 node --test
          npm run build:admin
